# .circleci/config.yml
version: 2.1

jobs:
  quality:
    docker:
      - image: cimg/node:20.19

    working_directory: ~/proyecto

    steps:
      - checkout

      - restore_cache:
          keys:
            - dependencies-v1-{{ checksum "backend/package-lock.json" }}-{{ checksum "frontend/package-lock.json" }}
            - dependencies-v1-

      - run:
          name: Instalar dependencias del backend
          command: npm ci --prefix backend

      - run:
          name: Instalar dependencias del frontend
          command: npm ci --prefix frontend

      - save_cache:
          key: dependencies-v1-{{ checksum "backend/package-lock.json" }}-{{ checksum "frontend/package-lock.json" }}
          paths:
            - backend/node_modules
            - frontend/node_modules

      - run:
          name: Lint del backend
          command: npm run lint --prefix backend

      - run:
          name: Lint del frontend
          command: npm run lint --prefix frontend

      - run:
          name: Build del frontend
          command: npm run build --prefix frontend

      - store_artifacts:
          path: frontend/dist
          destination: frontend-dist

workflows:
  quality_checks:
    jobs:
      - quality