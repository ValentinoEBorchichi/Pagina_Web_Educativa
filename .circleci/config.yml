version: 2.1

jobs:
  quality:
    docker:
      - image: cimg/node:20.19

    working_directory: ~/proyecto

    steps:
      - checkout

      - restore_cache:
          keys:
            - dependencies-v1-{{ checksum "Plataforma_Web_Educativa_ACTIVIDAD3/backend/package-lock.json" }}-{{ checksum "Plataforma_Web_Educativa_ACTIVIDAD3/frontend/package-lock.json" }}
            - dependencies-v1-

      - run:
          name: Instalar dependencias del backend
          command: npm ci --legacy-peer-deps --prefix Plataforma_Web_Educativa_ACTIVIDAD3/backend

      - run:
          name: Instalar dependencias del frontend
          command: npm ci --legacy-peer-deps --prefix Plataforma_Web_Educativa_ACTIVIDAD3/frontend

      - save_cache:
          key: dependencies-v1-{{ checksum "Plataforma_Web_Educativa_ACTIVIDAD3/backend/package-lock.json" }}-{{ checksum "Plataforma_Web_Educativa_ACTIVIDAD3/frontend/package-lock.json" }}
          paths:
            - Plataforma_Web_Educativa_ACTIVIDAD3/backend/node_modules
            - Plataforma_Web_Educativa_ACTIVIDAD3/frontend/node_modules

      - run:
          name: Lint del backend
          command: npm run lint --prefix Plataforma_Web_Educativa_ACTIVIDAD3/backend

      - run:
          name: Lint del frontend
          command: npm run lint --prefix Plataforma_Web_Educativa_ACTIVIDAD3/frontend

      - run:
          name: Tests automatizados del backend
          command: npm test --prefix Plataforma_Web_Educativa_ACTIVIDAD3/backend

      - run:
          name: Build del frontend
          command: npm run build --prefix Plataforma_Web_Educativa_ACTIVIDAD3/frontend

      - store_artifacts:
          path: Plataforma_Web_Educativa_ACTIVIDAD3/frontend/dist
          destination: frontend-dist

workflows:
  quality_checks:
    jobs:
      - quality
